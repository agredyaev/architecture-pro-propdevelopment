# НЕБЕЗОПАСНЫЙ МАНИФЕСТ - для демонстрации нарушений политики
# Нарушение: hostPath монтирует файловую систему хоста в контейнер
apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: audit-zone
  labels:
    app: insecure-hostpath
    security-violation: host-filesystem-access
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: host-data
          mountPath: /host-data
  volumes:
    - name: host-data
      hostPath:  # НАРУШЕНИЕ: прямой доступ к файловой системе хоста
        path: /var/log
        type: Directory
