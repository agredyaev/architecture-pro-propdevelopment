# БЕЗОПАСНЫЙ МАНИФЕСТ - соответствует PodSecurity restricted
# Исправления:
# - runAsUser изменён с 0 (root) на 65534 (nobody)
# - runAsNonRoot установлен в true
# - добавлен полный набор security controls
apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-03
  namespace: audit-zone
  labels:
    app: secure-nginx-nonroot
    security-compliant: "true"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534  # nobody user вместо root (0)
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: nginx
      image: nginx:1.25-alpine

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true  # Обязательно true
        runAsUser: 65534     # Обязательно не-root
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      ports:
        - containerPort: 8080

      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run

  volumes:
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
    - name: run
      emptyDir: {}
