# БЕЗОПАСНЫЙ МАНИФЕСТ - соответствует PodSecurity restricted
# Исправления:
# - hostPath заменён на emptyDir (эфемерное хранилище)
# - добавлены все требуемые securityContext параметры
apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-02
  namespace: audit-zone
  labels:
    app: secure-nginx-storage
    security-compliant: "true"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: nginx
      image: nginx:1.25-alpine

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      ports:
        - containerPort: 8080

      volumeMounts:
        - name: app-data
          mountPath: /app-data
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run

  volumes:
    - name: app-data
      emptyDir: {}  # Безопасная альтернатива hostPath
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
    - name: run
      emptyDir: {}
