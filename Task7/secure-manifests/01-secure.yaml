# БЕЗОПАСНЫЙ МАНИФЕСТ - соответствует PodSecurity restricted
# Исправления:
# - privileged: удалено (по умолчанию false)
# - добавлен runAsNonRoot: true
# - добавлен readOnlyRootFilesystem: true
# - добавлены drop capabilities и seccomp profile
apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-01
  namespace: audit-zone
  labels:
    app: secure-nginx
    security-compliant: "true"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534  # nobody user
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: nginx
      image: nginx:1.25-alpine

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      ports:
        - containerPort: 8080  # Непривилегированный порт

      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run

  volumes:
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
    - name: run
      emptyDir: {}
